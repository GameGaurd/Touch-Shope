<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="100" fill="#7c9cff"/>
  
  <!-- Shopping bag shape -->
  <g transform="translate(100, 100)">
    <!-- Bag body -->
    <path d="M -40 -20 L -40 40 Q -40 50 -30 50 L 30 50 Q 40 50 40 40 L 40 -20 Z" 
          fill="#0b1020" stroke="#34d399" stroke-width="3"/>
    
    <!-- Bag handles -->
    <path d="M -30 -20 Q -30 -50 0 -55 Q 30 -50 30 -20" 
          fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Shopping cart lines -->
    <line x1="-20" y1="0" x2="-20" y2="30" stroke="#34d399" stroke-width="2"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="#34d399" stroke-width="2"/>
    <line x1="20" y1="0" x2="20" y2="30" stroke="#34d399" stroke-width="2"/>
  </g>
</svg>